<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Consulta - Optometria Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-gray-800 antialiased p-4 max-w-md mx-auto">

<header class="mb-6 text-center">
  <h1 class="text-2xl font-bold text-blue-600">Editar Consulta</h1>
  <p class="text-sm text-gray-500">Paciente: {{ consulta.nome_paciente }}</p>
</header>

<main class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4">
  <form method="POST" class="space-y-4">
    {% csrf_token %}

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Data da Consulta</label>
      {{ form.data_consulta }}
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Paciente</label>
      {{ form.nome_paciente }}
    </div>

    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
      {{ form.lentes }}
      <label for="{{ form.lentes.id_for_label }}" class="text-base font-medium text-gray-700 cursor-pointer">
        Lentes de Contacto?
      </label>
    </div>

    <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
      {{ form.progressivas }}
      <label for="{{ form.progressivas.id_for_label }}" class="text-base font-medium text-gray-700 cursor-pointer">
        Lentes Progressivas?
      </label>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Notas</label>
      {{ form.notas }}
    </div>

    <div class="flex space-x-2 pt-2">
      <a href="{% url 'home' %}" class="w-1/2 text-center bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-xl transition duration-200">
        Cancelar
      </a>
      <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow transition duration-200">
        Guardar
      </button>
    </div>
  </form>
</main>

</body>
</html>
